<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17113d">
  <meta name="description" content="유아·초등 저학년을 위한 질문·탐구·성찰형 마법학교 게임">
  <title>마법학교 질문탐험대: 사라진 빛의 별</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="scene" class="scene" aria-live="polite">
      <div class="scene-shade"></div>

      <header id="topBar" class="top-bar hidden">
        <div class="brand-mini">
          <span class="brand-star">✦</span>
          <span>질문탐험대</span>
        </div>
        <nav id="progressNav" class="progress-nav" aria-label="방 진행 상황"></nav>
        <div class="top-actions">
          <button id="evidenceButton" class="icon-button" type="button" aria-label="단서책 열기">📖</button>
          <button id="soundButton" class="icon-button" type="button" aria-label="소리 켜기 또는 끄기">🔊</button>
          <button id="homeButton" class="icon-button" type="button" aria-label="처음 화면">⌂</button>
        </div>
      </header>

      <div id="actorLayer" class="actor-layer hidden" aria-hidden="true">
        <div id="heroSprite" class="hero-sprite hero-idle"></div>
        <div id="lumiSprite" class="lumi-sprite"></div>
      </div>

      <section id="content" class="scene-content"></section>
      <div id="toast" class="toast" role="status" aria-live="assertive"></div>
    </section>
  </main>

  <dialog id="portalDialog" class="magic-dialog">
    <div class="dialog-inner portal-inner">
      <div class="portal-sprite" aria-hidden="true"></div>
      <img id="portalFragment" class="portal-fragment" alt="">
      <h2 id="portalTitle">포탈이 열렸어요!</h2>
      <p id="portalText"></p>
      <button id="portalNextButton" class="primary-button" type="button">다음 방으로 이동</button>
    </div>
  </dialog>

  <dialog id="evidenceDialog" class="magic-dialog evidence-dialog">
    <div class="dialog-inner">
      <button id="closeEvidenceButton" class="dialog-close" type="button" aria-label="닫기">×</button>
      <h2>나의 마법 단서책</h2>
      <p id="selectedQuestionLabel" class="selected-question"></p>
      <div id="evidenceList" class="evidence-list"></div>
    </div>
  </dialog>

  <dialog id="resetDialog" class="magic-dialog confirm-dialog">
    <div class="dialog-inner">
      <h2>처음부터 다시 할까요?</h2>
      <p>모아 둔 질문과 단서가 모두 사라집니다.</p>
      <div class="button-row">
        <button id="cancelResetButton" class="secondary-button" type="button">계속하기</button>
        <button id="confirmResetButton" class="danger-button" type="button">처음부터</button>
      </div>
    </div>
  </dialog>

  <noscript>이 게임을 실행하려면 브라우저의 JavaScript를 켜 주세요.</noscript>
  <script src="./js/app.js"></script>
</body>
</html>
